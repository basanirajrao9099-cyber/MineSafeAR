<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Page background -->
  <rect width="210" height="297" fill="white"/>

  <!-- Header Info -->
  <text x="105" y="18" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#1E293B">MineSafeAR — Printed Tracking Marker</text>
  <text x="105" y="24" font-family="Arial, sans-serif" font-size="4" text-anchor="middle" fill="#475569">OpenCV ArUco Dictionary: DICT_4X4_50 | Marker ID: 0</text>
  <text x="105" y="29" font-family="Arial, sans-serif" font-size="3.5" text-anchor="middle" fill="#0284C7">Target Scale: 20 cm × 20 cm (0.20 m) — Do NOT scale during printing (100% / Actual Size)</text>

  <!-- 200mm x 200mm Outer Quiet Zone / White Box centered at x=5mm..205mm, y=35mm..235mm -->
  <!-- ArUco 6x6 grid in range x=5 to 205 (width 200mm), y=35 to 235 (height 200mm) -->
  <g transform="translate(5, 35)">
    <!-- White quiet zone rectangle -->
    <rect x="0" y="0" width="200" height="200" fill="white" stroke="#94A3B8" stroke-width="0.3" stroke-dasharray="2,2"/>
    <rect x="0.000" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="33.333" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="66.667" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="100.000" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="133.333" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="0.000" width="33.333" height="33.333" fill="black"/>
    <rect x="0.000" y="33.333" width="33.333" height="33.333" fill="black"/>
    <rect x="66.667" y="33.333" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="33.333" width="33.333" height="33.333" fill="black"/>
    <rect x="0.000" y="66.667" width="33.333" height="33.333" fill="black"/>
    <rect x="33.333" y="66.667" width="33.333" height="33.333" fill="black"/>
    <rect x="100.000" y="66.667" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="66.667" width="33.333" height="33.333" fill="black"/>
    <rect x="0.000" y="100.000" width="33.333" height="33.333" fill="black"/>
    <rect x="33.333" y="100.000" width="33.333" height="33.333" fill="black"/>
    <rect x="66.667" y="100.000" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="100.000" width="33.333" height="33.333" fill="black"/>
    <rect x="0.000" y="133.333" width="33.333" height="33.333" fill="black"/>
    <rect x="33.333" y="133.333" width="33.333" height="33.333" fill="black"/>
    <rect x="66.667" y="133.333" width="33.333" height="33.333" fill="black"/>
    <rect x="133.333" y="133.333" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="133.333" width="33.333" height="33.333" fill="black"/>
    <rect x="0.000" y="166.667" width="33.333" height="33.333" fill="black"/>
    <rect x="33.333" y="166.667" width="33.333" height="33.333" fill="black"/>
    <rect x="66.667" y="166.667" width="33.333" height="33.333" fill="black"/>
    <rect x="100.000" y="166.667" width="33.333" height="33.333" fill="black"/>
    <rect x="133.333" y="166.667" width="33.333" height="33.333" fill="black"/>
    <rect x="166.667" y="166.667" width="33.333" height="33.333" fill="black"/>
  </g>

  <!-- Corner Crop / Cut Marks -->
  <g stroke="#0F172A" stroke-width="0.5">
    <!-- Top-Left -->
    <line x1="0" y1="35" x2="3" y2="35"/>
    <line x1="5" y1="30" x2="5" y2="33"/>
    <!-- Top-Right -->
    <line x1="207" y1="35" x2="210" y2="35"/>
    <line x1="205" y1="30" x2="205" y2="33"/>
    <!-- Bottom-Left -->
    <line x1="0" y1="235" x2="3" y2="235"/>
    <line x1="5" y1="237" x2="5" y2="240"/>
    <!-- Bottom-Right -->
    <line x1="207" y1="235" x2="210" y2="235"/>
    <line x1="205" y1="237" x2="205" y2="240"/>
  </g>

  <!-- 20cm Reference Ruler at bottom -->
  <g transform="translate(5, 250)">
    <rect x="0" y="0" width="200" height="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.3"/>
    <text x="100" y="5.5" font-family="Arial, sans-serif" font-size="3" text-anchor="middle" fill="#64748B">Verify physical print measurement: line below must measure exactly 20.0 cm (200 mm)</text>
    <line x1="0" y1="7" x2="200" y2="7" stroke="#0284C7" stroke-width="0.8"/>
    <line x1="0" y1="2" x2="0" y2="7" stroke="#0284C7" stroke-width="0.8"/>
    <line x1="50" y1="4" x2="50" y2="7" stroke="#0284C7" stroke-width="0.5"/>
    <line x1="100" y1="2" x2="100" y2="7" stroke="#0284C7" stroke-width="0.8"/>
    <line x1="150" y1="4" x2="150" y2="7" stroke="#0284C7" stroke-width="0.5"/>
    <line x1="200" y1="2" x2="200" y2="7" stroke="#0284C7" stroke-width="0.8"/>
    <text x="0" y="11" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle" fill="#475569">0cm</text>
    <text x="50" y="11" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle" fill="#475569">5cm</text>
    <text x="100" y="11" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle" fill="#475569">10cm</text>
    <text x="150" y="11" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle" fill="#475569">15cm</text>
    <text x="200" y="11" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle" fill="#475569">20cm</text>
  </g>

  <!-- Mounting Instructions Footer -->
  <text x="105" y="278" font-family="Arial, sans-serif" font-size="3" font-weight="bold" text-anchor="middle" fill="#334155">MOUNTING INSTRUCTIONS FOR MINESAFEAR AR</text>
  <text x="105" y="283" font-family="Arial, sans-serif" font-size="2.6" text-anchor="middle" fill="#64748B">1. Attach flatly to wall or floor using tape/tack (avoid curling or bending).</text>
  <text x="105" y="287" font-family="Arial, sans-serif" font-size="2.6" text-anchor="middle" fill="#64748B">2. Ensure well-lit room without heavy glare or shadow over the marker.</text>
  <text x="105" y="291" font-family="Arial, sans-serif" font-size="2.6" text-anchor="middle" fill="#64748B">3. Point phone camera at marker from 1.0 m to 3.0 m distance for 6-DoF AR tracking.</text>
</svg>